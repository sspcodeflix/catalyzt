<!-- Design mock-ups. ?scene=home|analysis|authoring|feedback|execution|cloudops|security|context|contextdetail|itemchat|huddle&theme=light|dark. Render with render.py. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-sans/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-serif/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-serif/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/ibm-plex-mono/500.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--hz-bg); color: var(--hz-text); font: 15px/1.6 var(--hz-font-ui); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--hz-font-mono); font-size: .9em; }
  .muted { color: var(--hz-text-muted); }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  svg.sm { width: 15px; height: 15px; }

  /* Shell */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { flex: 0 0 var(--hz-sidebar-w); width: var(--hz-sidebar-w); min-width: 0; background: var(--hz-sidebar); border-right: 1px solid var(--hz-divider); display: flex; flex-direction: column; padding: 12px 10px; gap: 4px; }
  .brandrow { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mbrand { display: none; align-items: center; margin-right: 2px; }
  .brand b { font: 500 15px/1 var(--hz-font-mono); letter-spacing: .18em; text-transform: uppercase; }
  .nav a { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: var(--hz-radius-md); font-size: 14px; color: var(--hz-text); text-decoration: none; }
  .nav a.on { background: var(--hz-hover); font-weight: 500; }
  .navcount { margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--hz-radius-pill); background: var(--hz-accent-tint); color: var(--hz-accent-text); font: 600 11.5px/20px var(--hz-font-ui); text-align: center; }
  .nav .i { color: var(--hz-text-secondary); }
  .group { font-size: 12px; color: var(--hz-text-muted); padding: 14px 10px 4px; font-weight: 500; }
  .recent { display: block; min-height: 34px; line-height: 34px; padding: 0 10px; border-radius: var(--hz-radius-sm); font-size: 13.5px; color: var(--hz-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
  .recent.on { background: var(--hz-hover); font-weight: 500; }
  .appdot { width: 8px; height: 8px; border-radius: 2px; background: var(--hz-text-muted); display: inline-block; margin-right: 8px; }
  .grow { flex: 1; }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px; border-top: 1px solid var(--hz-divider); margin-top: 8px; font-size: 13.5px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--hz-surface-muted); color: var(--hz-text); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; border: 1px solid var(--hz-border); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--hz-divider); }
  .top .title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; }
  .ghost { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 0; border-radius: var(--hz-radius-md); background: transparent; font-size: 14px; font-weight: 500; color: var(--hz-text); }
  .icon { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--hz-radius-md); background: transparent; color: var(--hz-text-secondary); position: relative; }
  .unread { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--hz-accent); border: 2px solid var(--hz-bg); }
  .menu { display: none; }

  .body { flex: 1; display: flex; min-height: 0; }
  .chatcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .split .chatcol { flex: 0 0 46%; border-right: 1px solid var(--hz-divider); }
  .thread { width: 100%; max-width: var(--hz-thread-max); margin: 0 auto; padding: 28px 24px 8px; display: flex; flex-direction: column; gap: 26px; flex: 1; }
  .split .thread { max-width: var(--hz-thread-max-split); }

  /* Messages */
  .user { align-self: flex-end; max-width: 80%; background: var(--hz-surface-muted); padding: 10px 16px; border-radius: 18px 18px 6px 18px; }
  .turn { display: grid; grid-template-columns: 26px 1fr; gap: 14px; }
  .turn .content { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .turn p { margin: 0; }
  .prose { font-size: 15.5px; line-height: 1.65; }
  .runrow { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 4px 10px 4px 8px; border-radius: var(--hz-radius-sm); font-size: 13.5px; color: var(--hz-text-secondary); }
  .runrow .ok { color: var(--hz-pass); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 1px solid var(--hz-border); border-radius: var(--hz-radius-md); background: var(--hz-surface); font-size: 13.5px; }
  .cite { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; margin: 0 1px; border-radius: 5px; background: var(--hz-surface-muted); font: 500 11px/1 var(--hz-font-mono); color: var(--hz-text-secondary); vertical-align: 2px; }

  .msgactions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; color: var(--hz-text-muted); font-size: 13px; }
  .msgactions .icon { width: 32px; height: 32px; }
  .rate { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding-left: 10px; border-left: 1px solid var(--hz-divider); }
  .star { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; }
  .star svg { width: 17px; height: 17px; stroke: var(--hz-neutral-ring); fill: none; stroke-width: 1.6; }
  .star.on svg { stroke: var(--hz-warn); fill: var(--hz-warn); }
  .gatehint { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; color: var(--hz-warn-text); font-weight: 500; }

  /* Cards */
  .card { background: var(--hz-surface); border: 1px solid var(--hz-border); border-radius: var(--hz-radius-xl); box-shadow: var(--hz-shadow-card); }
  .artifact { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--hz-radius-lg); max-width: 460px; }
  .artifact.open { border-color: var(--hz-border-strong); background: var(--hz-surface-sunken); }
  .tile { width: 40px; height: 40px; border-radius: var(--hz-radius-md); background: var(--hz-surface-muted); display: inline-flex; align-items: center; justify-content: center; color: var(--hz-text-secondary); flex-shrink: 0; }
  .artifact b { display: block; font-weight: 500; font-size: 14px; }
  .artifact span { font-size: 12.5px; color: var(--hz-text-muted); }

  .approve { overflow: hidden; }
  .approve .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 4px; font-weight: 600; font-size: 14.5px; }
  .approve .head .i { color: var(--hz-accent-text); }
  .approve .sub { padding: 0 16px 10px 44px; font-size: 13.5px; color: var(--hz-text-secondary); }
  .approve dl { margin: 0; padding: 12px 16px; display: grid; grid-template-columns: 132px 1fr; gap: 6px 14px; font-size: 13.5px; border-top: 1px solid var(--hz-divider); }
  .approve dt { color: var(--hz-text-muted); }
  .approve dd { margin: 0; }
  .approve .foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--hz-divider); background: var(--hz-surface-sunken); flex-wrap: wrap; }
  .lockline { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--hz-text-secondary); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: var(--hz-radius-md); border: 1px solid var(--hz-border-strong); background: var(--hz-surface); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
  .btn.ink { background: var(--hz-ink); color: var(--hz-on-ink); border-color: var(--hz-ink); }
  .btn.plain { border-color: transparent; background: transparent; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }

  .steps { padding: 14px 16px; display: flex; flex-direction: column; }
  .steps header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .steps header b { font-weight: 600; font-size: 14px; }
  .bar { height: 4px; background: var(--hz-track); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
  .bar i { display: block; height: 100%; background: var(--hz-ink); border-radius: 99px; }
  .step { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 7px 0; border-top: 1px solid var(--hz-divider); font-size: 13.5px; align-items: start; }
  .step:first-of-type { border-top: 0; }
  .step small { display: block; color: var(--hz-text-muted); font-size: 12.5px; }
  .step time { font: 12px var(--hz-font-mono); color: var(--hz-text-muted); }
  .tag { font: 500 10.5px/1 var(--hz-font-mono); padding: 3px 6px; border-radius: 5px; background: var(--hz-surface-muted); color: var(--hz-text-secondary); margin-left: 6px; vertical-align: 1px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: var(--hz-radius-pill); font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--hz-surface-muted); color: var(--hz-text-secondary); }
  .pill.pass { background: var(--hz-pass-tint); color: var(--hz-pass-text); }
  .pill.warn { background: var(--hz-warn-tint); color: var(--hz-warn-text); }
  .pill.high { background: var(--hz-high-tint); color: var(--hz-high-text); }
  .pill.crit { background: var(--hz-crit-tint); color: var(--hz-crit-text); }
  .pill.info { background: var(--hz-info-tint); color: var(--hz-info-text); }
  .mk { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* Composer */
  .composerwrap { padding: 12px 24px 18px; }
  .composer { max-width: var(--hz-thread-max); margin: 0 auto; background: var(--hz-surface); border: 1px solid var(--hz-border); border-radius: var(--hz-radius-2xl); box-shadow: var(--hz-shadow-composer); padding: 14px 14px 10px 16px; display: flex; flex-direction: column; gap: 12px; }
  .split .composer { max-width: var(--hz-thread-max-split); }
  .split .wide { display: none; }
  .short { display: none; }
  .split .short { display: inline; }
  .composer .ph { color: var(--hz-text-placeholder); font-size: 15.5px; min-height: 26px; }
  .composer .row { display: flex; align-items: center; gap: 6px; }
  .pick { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: var(--hz-radius-md); border: 1px solid transparent; background: transparent; font-size: 13.5px; font-weight: 500; color: var(--hz-text-secondary); white-space: nowrap; }
  .pick.outlined { border-color: var(--hz-border); }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--hz-accent); color: var(--hz-on-accent); display: inline-flex; align-items: center; justify-content: center; margin-left: auto; }
  .fine { text-align: center; font-size: 12px; color: var(--hz-text-muted); margin-top: 8px; }

  .strip { max-width: var(--hz-thread-max); margin: 0 auto 10px; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; background: var(--hz-surface); border: 1px solid var(--hz-border); border-radius: var(--hz-radius-lg); font-size: 13.5px; }
  .strip .grow { min-width: 0; }
  .strip .line { display: flex; justify-content: space-between; gap: 12px; white-space: nowrap; }
  .strip .bar { height: 3px; margin: 6px 0 0; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--hz-track); border-top-color: var(--hz-accent); flex-shrink: 0; }

  /* Home */
  .home { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px 20px; gap: 28px; }
  .hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .hero h1 { margin: 8px 0 0; font: 400 42px/1.15 var(--hz-font-display); letter-spacing: -.015em; }
  .hero p { margin: 0; color: var(--hz-text-secondary); font-size: 16px; }
  .home .composer { width: 100%; max-width: 720px; }
  .caps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 980px; }
  .cap { text-align: left; padding: 14px; border: 1px solid var(--hz-border); border-radius: var(--hz-radius-lg); background: var(--hz-surface); display: flex; flex-direction: column; gap: 6px; min-height: 132px; }
  .cap .tile { width: 34px; height: 34px; }
  .cap b { font-weight: 600; font-size: 14px; }
  .cap span { font-size: 13px; color: var(--hz-text-secondary); line-height: 1.45; }
  .cap em { font-style: normal; font-size: 12.5px; color: var(--hz-text-muted); margin-top: auto; }

  /* Side panel */
  .panel { flex: 1; min-width: 0; background: var(--hz-surface); display: flex; flex-direction: column; }
  .phead { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px 14px 28px; border-bottom: 1px solid var(--hz-divider); }
  .phead .t { flex: 1; min-width: 0; }
  .phead b { display: block; font-weight: 600; font-size: 15px; }
  .phead span { font-size: 12.5px; color: var(--hz-text-muted); }
  .pbody { padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 26px; }
  .herorow { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: end; }
  .big { font: 400 84px/0.95 var(--hz-font-display); letter-spacing: -.03em; }
  .big small { font-size: 40px; }
  .herorow p { margin: 10px 0 0; font-size: 13.5px; color: var(--hz-text-secondary); max-width: 320px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 20px; }
  .kpi { border-left: 1px solid var(--hz-border); padding-left: 14px; }
  .kpi b { display: block; font: 500 30px/1.1 var(--hz-font-display); font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12.5px; color: var(--hz-text-secondary); }
  h3 { margin: 0; font: 500 20px/1.3 var(--hz-font-display); }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .sechead span { font-size: 12.5px; color: var(--hz-text-muted); }
  .seg { display: flex; gap: 2px; height: 14px; }
  .seg i { display: block; height: 100%; min-width: 6px; }
  .seg i:first-child { border-radius: 4px 0 0 4px; }
  .seg i:last-child { border-radius: 0 4px 4px 0; }
  .legend { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--hz-text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend b { color: var(--hz-text); font-weight: 600; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .search { flex: 1 1 180px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--hz-border); border-radius: var(--hz-radius-md); font-size: 13.5px; color: var(--hz-text-placeholder); }
  .segctl { display: inline-flex; padding: 3px; background: var(--hz-surface-muted); border-radius: var(--hz-radius-md); font-size: 13px; }
  .segctl span { padding: 5px 10px; border-radius: 7px; color: var(--hz-text-secondary); white-space: nowrap; }
  .segctl span.on { background: var(--hz-surface); color: var(--hz-text); font-weight: 500; box-shadow: var(--hz-shadow-card); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--hz-text-muted); padding: 8px 10px 8px 0; border-bottom: 1px solid var(--hz-border); white-space: nowrap; }
  td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--hz-divider); vertical-align: top; }
  th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
  .tfoot { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; font-size: 12.5px; color: var(--hz-text-muted); }
  .links { display: flex; gap: 22px; font-size: 13.5px; color: var(--hz-text-secondary); padding-top: 14px; border-top: 1px solid var(--hz-divider); }

  .code { font: 12.5px/1.75 var(--hz-font-mono); background: var(--hz-surface-sunken); border: 1px solid var(--hz-border); border-radius: var(--hz-radius-lg); overflow: hidden; }
  .code .file { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--hz-border); font-size: 12px; color: var(--hz-text-secondary); background: var(--hz-surface); }
  .code pre { margin: 0; padding: 10px 0; white-space: pre; overflow: hidden; }
  .code .ln { display: inline-block; width: 40px; padding-right: 12px; text-align: right; color: var(--hz-text-muted); user-select: none; }
  .code .add { background: var(--hz-pass-tint); display: block; }
  .code .del { background: var(--hz-crit-tint); display: block; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hz-border); }
  .tabs span { padding: 8px 12px; font-size: 13.5px; color: var(--hz-text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .tabs span.on { color: var(--hz-text); border-color: var(--hz-ink); font-weight: 500; }
  .callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--hz-radius-lg); background: var(--hz-surface-sunken); border: 1px solid var(--hz-border); font-size: 13.5px; color: var(--hz-text-secondary); }

  .triage { display: flex; flex-direction: column; }
  .triage .g { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 16px; border-top: 1px solid var(--hz-divider); font-size: 13.5px; }
  .triage .g:first-child { border-top: 0; }
  .triage .g b { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .triage .g small { grid-column: 1 / -1; color: var(--hz-text-secondary); font-size: 13px; }

  .env { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--hz-font-mono); padding: 4px 7px; border-radius: 6px; background: var(--hz-info-tint); color: var(--hz-info-text); }

  /* Feedback */
  .fb { overflow: hidden; }
  .fb .fbtop { display: flex; align-items: center; gap: 12px; padding: 14px 16px 6px; flex-wrap: wrap; }
  .fb .fbtop b { font-weight: 600; font-size: 14.5px; }
  .fb .scale { font-size: 13px; color: var(--hz-text-secondary); }
  .fb .sec { padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
  .fb label, .fb .lbl { font-size: 13px; font-weight: 500; }
  .fb .req { color: var(--hz-crit-text); font-weight: 500; font-size: 12.5px; margin-left: 4px; }
  .reasons { display: flex; gap: 6px; flex-wrap: wrap; }

  .reason.on { border-color: var(--hz-ink); background: var(--hz-ink); color: var(--hz-on-ink); }
  .quote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: var(--hz-radius-md); background: var(--hz-surface-sunken); border: 1px solid var(--hz-border); font-size: 12.5px; }
  .quote .mono { color: var(--hz-text); }
  .quote .x { margin-left: auto; color: var(--hz-text-muted); }
  .ta { min-height: 64px; padding: 10px 12px; border: 1px solid var(--hz-border-strong); border-radius: var(--hz-radius-md); background: var(--hz-surface); font-size: 14px; line-height: 1.5; }
  .ta.vague { border-color: var(--hz-warn); }
  .meter { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--hz-text-muted); }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 8px 10px; border-radius: var(--hz-radius-md); background: var(--hz-warn-tint); color: var(--hz-warn-text); }
  .check ul { margin: 2px 0 0; padding-left: 16px; }
  .check.ok { background: var(--hz-pass-tint); color: var(--hz-pass-text); }
  .refined { border: 1px solid var(--hz-border); border-radius: var(--hz-radius-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; background: var(--hz-surface-sunken); }
  .refined .lbl { display: flex; align-items: center; gap: 6px; color: var(--hz-text-secondary); font-size: 12.5px; }
  .ctx { margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .ctx dt { color: var(--hz-text-muted); }
  .ctx dd { margin: 0; }
  .fb .foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--hz-divider); background: var(--hz-surface-sunken); flex-wrap: wrap; }
  .hl { background: var(--hz-warn-tint); outline: 1px solid var(--hz-warn); display: block; }

  /* App Context */
  .page { width: 100%; max-width: 1120px; margin: 0 auto; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 22px; }
  .split .page { max-width: none; padding: 24px 24px 32px; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .pagehead h1 { margin: 0; font: 400 32px/1.2 var(--hz-font-display); letter-spacing: -.01em; }
  .pagehead p { margin: 6px 0 0; color: var(--hz-text-secondary); max-width: 640px; }
  .tiles { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; }
  .ctile { padding: 16px; display: flex; flex-direction: column; gap: 6px; }

  .ctile b { font: 500 28px/1.1 var(--hz-font-display); font-variant-numeric: tabular-nums; }

  .ekf { background: var(--hz-surface-sunken); }
  .drop { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; overflow: hidden; }
  .dz { margin: 14px; border: 1.5px dashed var(--hz-border-strong); border-radius: var(--hz-radius-lg); padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }

  .types { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .linkbox { padding: 18px; border-left: 1px solid var(--hz-divider); display: flex; flex-direction: column; gap: 10px; }
  .input { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border: 1px solid var(--hz-border-strong); border-radius: var(--hz-radius-md); background: var(--hz-surface); font-size: 13.5px; color: var(--hz-text-placeholder); }
  .scoperow { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
  .radio { display: inline-flex; align-items: center; gap: 6px; }
  .radio i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--hz-border-strong); display: inline-block; }
  .radio.on i { border: 5px solid var(--hz-ink); }
  .pipeline { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .pipe { display: flex; align-items: center; gap: 0; }
  .pstep { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--hz-text-muted); text-align: center; position: relative; }
  .pstep::before { content: ''; position: absolute; top: 10px; left: -50%; right: 50%; height: 2px; background: var(--hz-track); }
  .pstep:first-child::before { display: none; }
  .pstep.done::before, .pstep.run::before { background: var(--hz-pass); }
  .pdot { width: 22px; height: 22px; border-radius: 50%; background: var(--hz-surface); border: 2px solid var(--hz-track); position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; }
  .pstep.done .pdot { background: var(--hz-pass); border-color: var(--hz-pass); color: #fff; }
  .pstep.done .pdot svg { width: 13px; height: 13px; stroke-width: 2.5; }
  .pstep.run .pdot { border-color: var(--hz-accent); border-top-color: var(--hz-track); }
  .pstep.done, .pstep.run { color: var(--hz-text); }
  .dt { overflow: hidden; }
  .dt .toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--hz-divider); flex-wrap: wrap; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--hz-radius-pill); background: var(--hz-surface-muted); font-size: 12.5px; font-weight: 500; }

  .dt th, .dt td { padding-left: 14px; padding-right: 6px; }

  .doc .sel { background: var(--hz-info-tint); border-radius: 2px; }
  .pageno { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--hz-text-muted); }
  .pop { position: absolute; display: flex; gap: 2px; padding: 4px; background: var(--hz-ink); color: var(--hz-on-ink); border-radius: var(--hz-radius-md); box-shadow: var(--hz-shadow-composer); font: 500 12.5px/1 var(--hz-font-ui); }
  .pop span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 7px; }
  .pop span.on { background: rgb(255 255 255 / .14); }
  .compare { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .compare > div { padding: 12px 14px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
  .compare > div + div { border-left: 1px solid var(--hz-divider); }
  .compare b { font-size: 12.5px; color: var(--hz-text-muted); font-weight: 500; }
  .compare em { font: 400 22px/1.2 var(--hz-font-display); font-style: normal; }

  .hitem small { color: var(--hz-text-secondary); font-size: 13px; display: block; margin-top: 2px; }

  .option .votes { margin-left: auto; white-space: nowrap; font-size: 12.5px; color: var(--hz-text-muted); }
  .comment { display: grid; grid-template-columns: 32px 1fr; gap: 10px; font-size: 13.5px; }
  .comment b { font-weight: 600; }
  .comment time { color: var(--hz-text-muted); font-size: 12px; margin-left: 6px; }
  .comment p { margin: 2px 0 0; }
  .aisum { border: 1px solid var(--hz-border); border-radius: var(--hz-radius-lg); padding: 12px 14px; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; background: var(--hz-surface-sunken); }
  .aisum .lbl { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--hz-text-secondary); }

  @media (max-width: 899px) {
    .sidebar { display: none; }
    .menu { display: inline-flex; }

    .hidem { display: none !important; }
    .top { padding: 0 8px; }

    .split .chatcol { flex: none; border-right: 0; }
    .thread { padding: 18px 16px 8px; }

    .pbody { padding: 18px 16px 22px; }
    .phead { padding: 14px 12px 12px 16px; }
    .herorow { grid-template-columns: 1fr; gap: 18px; }
    .big { font-size: 64px; }
    .composerwrap { padding: 10px 12px 14px; }
    .caps { grid-template-columns: 1fr 1fr; }
    .tiles, .drop { grid-template-columns: 1fr; }
    .linkbox { border-left: 0; border-top: 1px solid var(--hz-divider); }
    .page { padding: 18px 16px 28px; }
    .hero h1 { font-size: 32px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'home';

const dark = document.documentElement.dataset.theme === 'dark';

const P = {

// Horizon mark: a scan-line sun rising over the horizon line, ending in a circuit node, inside a hexagon.
const mark = (s = 26, id = 'm' + Math.random().toString(36).slice(2, 7)) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true">

const sidebar = (active) => `
<aside class="sidebar" aria-label="Horizon">

    <a href="#">${ic('search')}Search</a>
    <a href="#" class="${active === 'context' ? 'on' : ''}">${ic('book')}App Context</a>
    <a href="#" class="${active === 'huddle' ? 'on' : ''}">${ic('people')}Huddle<span class="navcount">4</span></a>
  </nav>
  <div class="group">Recents</div>
  ${[
    ['analysis', 'Payments Hub coverage'],
    ['authoring', 'Refund tests for FR-0231'],
    ['execution', 'Why did nightly regression fail?'],
    ['cloudops', 'payments-api restarts in SIT-2'],
    ['security', 'Critical vulnerabilities in ABCD'],
    ['', 'Release 24.11 readiness'],
    ['', 'Explain FR-0218 with sources'],
  ].map(([k, t]) => `<a class="recent ${k === active ? 'on' : ''}" href="#">${t}</a>`).join('')}
  <div class="grow"></div>
  <div class="me"><span class="avatar">PN</span><div style="min-width:0"><div>Priya N.</div><div class="muted" style="font-size:12px">Payments Hub team</div></div></div>
